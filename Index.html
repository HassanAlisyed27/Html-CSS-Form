<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="submit.html">
</head>
<body style="background-color: rgb(58, 117, 165);">
    <div> 
    <h1>Travel Reservation Form</h1>
        <H2>* Denotes Mandatory</H2>
    </div>
        <label for="username"> Full Name*: </label> <br>
        <input type="text" required id="username" name="name" placeholder="First name        last name"><br>

        <label for="email">Email Address*:</label><br>
        <input type="email" required  name="email" id="email" placeholder="EMAIL_ADDRESS"><br>

        <label for="Package">Select Tour Package*:</label> <br>
        <select name="Package" required id="Package">
            <option value="Kashmir">Kashmir</option>
            <option value="Peshawar">Peshawar</option>
            <option value="Quetta">Quetta</option>
        </select><br>

        <label for="date">Arrival Date*:</label><br>
        <input type="date" required name="date" class="date"><br>

        <label for="Persons">Number of Persons*:</label> <br>
        <input type="text" required id="Persons" name="Persons" placeholder="UNKNOWN_TYPE"><br>

        What do u want to avail?* </Br>
        <label for="Fooding">Fooding</label>
        <input type="checkbox" required name="avail" id="Fooding"><br>
        <label for="Boarding">Boarding</label>
        <input type="checkbox" required name="avail" id="Boarding"><br>
        <label for="Sight Seeing">Sight Seeing</label>
        <input type="checkbox" required name="avail" id="Sight Seeing"><br>
        <label for="Discount">Discount Coupon Code:</label> <br>
        <input type="text" required id="Discount" name="Discount" placeholder="UNKNOWN_TYPE">
        <br>

        Terms and conditions* <br>
        <label for="agree">I agree</label>
        <input type="radio" required name="Terms" id="agree">
        <label for="disagree">I disagree</label>
        <input type="radio"  name="Terms" id="disagree"> <br>
        <input type="file" required accept=".png,.jpg,.pdf"><br><br>
        <a href="submit.html"><button>Complete Reservation</button></a>
</body>
</html>
